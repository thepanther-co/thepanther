<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Panther</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #800000;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: #111;
    }
h1 {
  font-family: 'Cinzel', serif;
  letter-spacing: 2px;
  font-size: 30px;
  color: white;
}

h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 48px;
  letter-spacing: 2px;
  font-weight: bold;
  color: white;
}
    .container {
      max-width: 400px;
      width: 90%;
    }

    .logo {
      width: 200px;
      margin-bottom: 6px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 30px;
      letter-spacing: 2px;
      margin: 10px 0 100px;
    }

    .coming {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 65px;
      letter-spacing: 2px;
      margin-bottom: 100px;
      color: white;
      font-weight: bold;
    }

    .subtext {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 10px;
    }

    input {
      width: 90%;
      padding: 14px;
      border-radius: 30px;
      background: transparent;
      color: white;
      border: 1px solid #ddd;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    button {
      width: 30%;
      padding: 14px;
      border: none;
      background: rgba(255, 255, 255, 0.4);
      color: #fff;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
    @media (min-width: 768px) {

  .container {
    max-width: 500px;
  }

  h2 {
    font-size: 70px;
  }

  h1 {
    font-size: 22px;
  }

  input {
    width: 350px;
  }

}
  </style>
</head>

<body>

  <div class="container">

    <!-- Replace this src with your logo image link later -->
    <img src="logo.jpg" class="logo">

    <h1>THE PANTHER</h1>

    <div class="coming">COMING SOON</div>

    <div class="subtext">
      Sign up for our newsletter to be the first to know when we launch.
    </div>

    <!-- Email Form (for now basic) -->
    <form onsubmit="submitForm(event)">
      <input type="email" placeholder="Email address" required>
      <button type="submit">SIGN UP</button>
    </form>

  </div>

  <script>
    function submitForm(e) {
      e.preventDefault();
      alert("You're on the list 🐆");
    }
  </script>

</body>
</html>
